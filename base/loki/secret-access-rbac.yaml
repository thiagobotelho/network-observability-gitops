apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-netobserv-secret-watcher
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: netobserv
  annotations:
    argocd.argoproj.io/sync-wave: '9'
# Referência de permissão; este vínculo não cria identidades no provedor.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netobserv-secret-watcher
# Identidades que recebem as permissões declaradas pelo papel referenciado.
subjects:
- kind: ServiceAccount
  name: netobserv-controller-manager
  namespace: openshift-netobserv-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-netobserv-secret-creator
  namespace: netobserv
  annotations:
    argocd.argoproj.io/sync-wave: '9'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netobserv-secret-creator
subjects:
- kind: ServiceAccount
  name: netobserv-controller-manager
  namespace: openshift-netobserv-operator
