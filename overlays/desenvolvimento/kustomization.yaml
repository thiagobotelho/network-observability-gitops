apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
labels:
- pairs:
    app.kubernetes.io/name: network-observability
    app.kubernetes.io/instance: network-observability-desenvolvimento
    app.kubernetes.io/component: flow-observability
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/environment: desenvolvimento
  includeSelectors: false
patches:
- path: diagnostico.yaml
- target:
    group: loki.grafana.com
    version: v1
    kind: LokiStack
    name: loki
    namespace: netobserv
  patch: "- op: add\n  path: /spec/storageClassName\n  value: crc-csi-hostpath-provisioner"
- target:
    group: loki.grafana.com
    kind: LokiStack
  patch: "- op: replace\n  path: /spec/storageClassName\n  value: crc-csi-hostpath-provisioner"
